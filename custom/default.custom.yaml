patch:
  # 菜单
  menu:
    page_size: 6  # 候选词个数
    # alternative_select_labels: [ ①, ②, ③, ④, ⑤, ⑥, ⑦, ⑧, ⑨, ⑩ ]  # 修改候选项标签
    # alternative_select_keys: ASDFGHJKL  # 如编码字符占用数字键，则需另设选字键
    # ascii_mode、inline、no_inline、vim_mode 等等设定，可参考 /Library/Input Methods/Squirrel.app/Contents/SharedSupport/squirrel.yaml

  # 中西文切换
  #
  # 【good_old_caps_lock】 CapsLock 切换到大写或切换中英。
  # （macOS 偏好设置的优先级更高，如果勾选【使用大写锁定键切换“ABC”输入法】则始终会切换输入法）
  #
  # 切换中英：
  # 不同的选项表示：打字打到一半时按下了 CapsLock、Shift、Control 后：
  # commit_code  上屏原始的编码，然后切换到英文
  # commit_text  上屏拼出的词句，然后切换到英文
  # clear        清除未上屏内容，然后切换到英文
  # inline_ascii 无输入时，切换中英；有输入时，切换到临时英文模式，按回车上屏后回到中文状态
  # noop         屏蔽快捷键，不切换中英，但不要屏蔽 CapsLock
  ascii_composer:
    good_old_caps_lock: true  # true | false
    switch_key:
      Caps_Lock: clear  # commit_code | commit_text | clear
      Shift_L: commit_code     # commit_code | commit_text | inline_ascii | clear | noop
      Shift_R: commit_code     # commit_code | commit_text | inline_ascii | clear | noop
      Control_L: noop   # commit_code | commit_text | inline_ascii | clear | noop
      Control_R: noop   # commit_code | commit_text | inline_ascii | clear | noop

  # Lua 配置: 以词定字（上屏当前词句的第一个或最后一个字），和中括号翻页有冲突
  key_binder/select_first_character: "bracketleft"  # 左中括号 [
  key_binder/select_last_character: "bracketright"  # 右中括号 ]

  # 翻页 , .
  key_binder/bindings/+:
  - { when: paging, accept: comma, send: Page_Up }
  - { when: has_menu, accept: period, send: Page_Down }
  # 翻页 [ ]  ⚠️ 开启时请修改上面以词定字的快捷键
  # - { when: paging, accept: bracketleft, send: Page_Up }
  # - { when: has_menu, accept: bracketright, send: Page_Down }
  # 翻页 [ ]  ⚠️ 开启时请修改上面以词定字的快捷键
  # - { when: paging, accept: bracketleft, send: Page_Up }
  # - { when: has_menu, accept: bracketright, send: Page_Down }

  schema_list:
  - {schema: double_pinyin_flypy}
  - {schema: rime_ice}

  # 处理符合特定规则的输入码，如网址、反查
  # 此处配置较为通用的选项，各方案中另增加了和方案功能绑定的 patterns。
  recognizer:
    patterns:
      email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"                            # email @ 之后不上屏
      url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"  # URL
      underscore: "^[A-Za-z]+_.*"  # 下划线不上屏

      # 注释后，有(高权重)候选词时句号默认翻页，无(高权重)候选词时输入句号此时为隐藏状态，继续输入字母后显示句号和前序后序所有字母
      # eg: woaini 句号翻页；woiain.ai 句号先隐藏再打出ai后显示
      # url_2: "^[A-Za-z]+[.].*"   # 句号不上屏，支持 google.com abc.txt 等网址或文件名，使用句号翻页时需要注释掉

      # 注释后，输入冒号，强制将候选词上屏
      # colon: "^[A-Za-z]+:.*"     # 冒号不上屏

      # 文件路径不上屏 from copilot
      # file_path: "^(/|~|\.|[A-Za-z]:\\).*"  

      # 连接符不上屏
      hyphen: "^[A-Za-z]+[-].*"